# MoveIt uses this configuration for controller management

moveit_controller_manager: moveit_simple_controller_manager/MoveItSimpleControllerManager

moveit_simple_controller_manager:
  controller_names:
    - ur10_arm_controller
    - gripper_command

  ur10_arm_controller:
    type: FollowJointTrajectory
    joints:
      - shoulder_pan_joint
      - shoulder_lift_joint
      - elbow_joint
      - wrist_1_joint
      - wrist_2_joint
      - wrist_3_joint
    action_ns: follow_joint_trajectory
    default: true

  gripper_command:
    type: GripperCommand
    joints:
      - gripper_planar_5
      - gripper_planar_4
    parallel: true
    action_ns: ""
    default: true