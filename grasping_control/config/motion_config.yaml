motion_execution_node:
  ros__parameters:
    action_name: move_arm_to_pose
    named_pose_action_name: move_arm_to_named_pose
    move_group_action_name: move_action
    planning_group: manipulator
    planning_frame: base_link
    end_effector_link: tcp
    allowed_planning_time: 5.0
    num_planning_attempts: 5
    max_velocity_scaling: 0.2
    max_acceleration_scaling: 0.2
    position_tolerance_m: 0.005
    orientation_tolerance_rad: 0.1
    planning_pipeline_id: ''
    planner_id: ''
    workspace_to_end_effector_height: 0.40
    poses_list:
      - workspace_center_pose
      - pre_grasp_pose
      - post_grasp_pose
    workspace_center_pose: [0.0, 0.0, 0.30, 0.0, 0.0, 0.0]
    pre_grasp_pose: [0.0, 0.0, 0.30, 0.0, 0.0, 0.0]
    post_grasp_pose: [0.0, 0.0, 0.30, 0.0, 0.0, 0.0]